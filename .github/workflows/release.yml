name: Release Spliit Cloud
run-name: Release ${{ github.ref_name }} (${{ github.sha }})

# Versioned releases. Push a `v*.*.*` tag to build, publish, create the
# GitHub Release from `releases/<tag>.md`, and deploy prod immediately.
# `main` pushes do nothing here; CI runs separately.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild and re-release (e.g. v2.0.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-notes:
    name: Validate release notes file
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Check releases/<tag>.md exists
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if [ ! -f "releases/${TAG}.md" ]; then
            echo "::error::Missing releases/${TAG}.md. Write the hand-written release notes first — see releases/README.md."
            exit 1
          fi
          echo "Found releases/${TAG}.md"

  build-and-push:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    needs: validate-notes
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, migrate, worker, mcp, web]
        arch: [amd64, arm64]
        include:
          - app: api
            scope: '@spliit/api'
            file: Dockerfile
            target: api
            image: spliit-cloud-api
          - app: migrate
            scope: '@spliit/db'
            file: Dockerfile
            target: migrate
            image: spliit-cloud-migrate
          - app: worker
            scope: '@spliit/worker'
            file: Dockerfile
            target: worker
            image: spliit-cloud-worker
          - app: mcp
            scope: '@spliit/mcp'
            file: Dockerfile
            target: mcp
            image: spliit-cloud-mcp
          - app: web
            scope: '@spliit/web'
            file: Dockerfile.web
            target: web
            image: spliit-cloud-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-notes.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.validate-notes.outputs.tag }},suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_SCOPE=${{ matrix.scope }}
            VITE_BUILD_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }},mode=max

  merge-images:
    name: Publish ${{ matrix.app }} multi-arch manifest
    needs: [validate-notes, build-and-push]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: spliit-cloud-api
          - app: migrate
            image: spliit-cloud-migrate
          - app: worker
            image: spliit-cloud-worker
          - app: mcp
            image: spliit-cloud-mcp
          - app: web
            image: spliit-cloud-web
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      # Only two floating tags exist: the immutable version and `latest`
      # (stable). No SHA, major/minor, or RC channels.
      - name: Create multi-arch manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          TAG: ${{ needs.validate-notes.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          docker buildx imagetools inspect "${IMAGE}:latest"

  create-release:
    name: Create GitHub Release
    needs: [validate-notes, merge-images]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-notes.outputs.tag }}
          fetch-depth: 1

      - name: Build notes from releases/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-notes.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="releases/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing $NOTES_FILE"
            exit 1
          fi

          cp "$NOTES_FILE" /tmp/notes.md

          # Rewrite relative screenshot links `./assets/...` (relative to
          # `releases/`) to absolute tagged blob URLs so they render on the
          # Releases page and stay pinned to this tag.
          # (`-i.bak` keeps this working on both GNU and BSD sed.)
          sed -i.bak "s#](\./assets/#](https://github.com/${{ github.repository }}/blob/${TAG}/releases/assets/#g" /tmp/notes.md
          rm -f /tmp/notes.md.bak

          # Append Docker image pointers. `:latest` always equals this
          # stable version.
          {
            echo ""
            echo "---"
            echo "### 🐳 Docker images for this release"
            echo ""
            repo_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            for img in spliit-cloud-api spliit-cloud-migrate spliit-cloud-worker spliit-cloud-mcp spliit-cloud-web; do
              echo "- \`ghcr.io/${repo_lc}/${img}:${TAG}\` (also available as \`:latest\`)"
            done
            echo ""
            echo "> Pin with \`SPLIIT_TAG=${TAG}\` or follow stable with \`SPLIIT_TAG=latest\` — see \`compose.yaml\`"
          } >> /tmp/notes.md

          cat /tmp/notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes..."
            gh release edit "$TAG" --notes-file /tmp/notes.md --repo "${{ github.repository }}"
          else
            gh release create "$TAG" --target "$TAG" --title "$TAG" --notes-file /tmp/notes.md --latest --repo "${{ github.repository }}"
          fi

          echo "Done: $TAG"

  deploy-dokploy:
    name: Trigger Dokploy deploy
    needs: [merge-images, create-release]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Trigger Dokploy compose deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_CF_BYPASS_SECRET: ${{ secrets.DOKPLOY_CF_BYPASS_SECRET }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ] || [ -z "$DOKPLOY_CF_BYPASS_SECRET" ]; then
            echo "Dokploy deploy secrets are not fully configured."
            echo "Required values: DOKPLOY_URL, DOKPLOY_COMPOSE_ID, DOKPLOY_API_KEY, DOKPLOY_CF_BYPASS_SECRET."
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "content-type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "x-dokploy-ci-token: $DOKPLOY_CF_BYPASS_SECRET" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}")"

          status="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Dokploy deploy request failed with HTTP $status."
            echo "$body"
            exit 1
          fi

          echo "$body"

  deploy-pages:
    name: Trigger Cloudflare Pages deploy
    needs: [merge-images, create-release]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Trigger CF Pages deploy
        env:
          CF_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK_URL" ]; then
            echo "CF_PAGES_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK_URL"
